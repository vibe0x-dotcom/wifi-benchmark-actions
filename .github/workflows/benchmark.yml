name: benchmark

on:
  workflow_dispatch:

jobs:
  shard-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C, D]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem (Dockerfile do repo)
        run: docker build -t bench .

      - name: Rodar shard ${{ matrix.shard }} no container
        run: |
          mkdir -p out-${{ matrix.shard }}
          docker run --rm \
            -v "$PWD:/workspace" \
            -e SHARD=${{ matrix.shard }} \
            bench /workspace/scripts/run-shard.sh /workspace/out-${{ matrix.shard }}/shard-${{ matrix.shard }}.log
          SHARD=${{ matrix.shard }} bash scripts/collect-result.sh out-${{ matrix.shard }}/shard-${{ matrix.shard }}.log || true
          ls -lh out-${{ matrix.shard }}/

      - name: Compactar resultados (ZIP)
        if: always()
        run: |
          zip -r benchmark-result-${{ matrix.shard }}.zip out-${{ matrix.shard }}/ || true
          ls -lh *.zip || true

      - name: Salvar artifact ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result-${{ matrix.shard }}
          path: benchmark-result-${{ matrix.shard }}.zip
          retention-days: 5
